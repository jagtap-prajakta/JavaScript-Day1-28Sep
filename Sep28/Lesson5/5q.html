<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <button onclick="
            calculation += 1;
            console.log(calculation);
            ">1</button>
        <button onclick="
            calculation += 2;
            console.log(calculation);
        ">2</button>
        <button onclick="
            calculation += 3;
            console.log(calculation);
        ">3</button>
        <button onclick="
            calculation += ' + ';
            console.log(calculation);
        ">+</button>

        <button onclick="
            calculation = eval(calculation);
            console.log(calculation);
            // Note : eval() takes a string and runs it as code.
            // avoid using eval() in real world projects since.
            // only use eval() for learning purpose
        ">=</button>

        <script>
            let calculation = '';
        </script>
    </body>
</html>
